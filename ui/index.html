<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLTP-AI</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="logo"></span>GLTP<b>·</b>AI</div>
    <form id="go-form" autocomplete="off">
      <input id="code" placeholder="Paste a map preset" spellcheck="false" aria-label="Map preset">
      <button type="button" id="permadeath" aria-pressed="false" title="Death is permanent: a pop ends the run">☠</button>
      <button type="button" id="place" title="Place checkpoints before starting">⚑</button>
      <button id="go">Go</button>
    </form>
    <select id="runs" aria-label="Past runs"><option value="">Past runs</option></select>
  </header>

  <main>
    <canvas id="map"></canvas>
    <div id="hero">
      <div class="logo big"></div>
      <h1>Paste a map preset and press Go.</h1>
      <p>The bot explores the map until it beats it, then keeps getting faster. Past runs are under <b>Past runs</b>.</p>
    </div>
    <div id="error" hidden></div>
    <section id="status" hidden>
      <div class="meter"><i id="meter"></i></div>
      <div class="text"><strong id="headline"></strong><span id="detail"></span></div>
      <div class="buttons">
        <select id="focus" aria-label="Where to explore from" title="Explore the whole route, or only from just past one checkpoint (greyed out: not reached yet)"></select>
        <button id="checkpoints" title="Checkpoints and red zones">⚑ ⛔ Edit</button>
        <button id="watch">▶ Watch in TagPro</button>
        <a id="download" class="button">⬇ Replay</a>
        <button id="stop" class="stop">Stop</button>
        <button id="continue">Continue</button>
      </div>
    </section>
    <section id="editing" hidden>
      <div class="text"><strong id="edit-title">Checkpoints</strong><span id="edit-help"></span></div>
      <div class="buttons">
        <button id="mode-cp" aria-pressed="true">⚑ Checkpoints</button>
        <button id="mode-red" aria-pressed="false">⛔ Red zones</button>
        <button id="cp-cancel">Cancel</button>
        <button id="cp-apply">Start with these</button>
      </div>
    </section>
  </main>

  <dialog id="tagpro">
    <div class="bar"><strong id="tagpro-title"></strong><button id="tagpro-close">Close</button></div>
    <iframe id="tagpro-frame" title="TagPro replay"></iframe>
  </dialog>

  <script src="/ui/sprites.js"></script>
  <script src="/ui/map.js"></script>
  <script src="/ui/app.js"></script>
</body>
</html>

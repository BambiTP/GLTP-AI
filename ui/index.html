<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLTP-AI</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/ui/play.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="ball"></span>GLTP<span class="dot">·</span>AI</div>
    <form class="code" id="code-form" autocomplete="off">
      <input id="code" placeholder="Map code" spellcheck="false" aria-label="Map code (Fortunate Maps id)">
      <button type="submit">Load</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="spacer"></div>
    <select id="algo" title="How the bot learns">
      <option value="explore">Go-Explore</option>
      <option value="neat">NEAT</option>
    </select>
    <button class="go" id="go" disabled>Go ▶</button>
  </header>

  <main id="stage">
    <canvas id="map"></canvas>

    <div class="hero" id="hero">
      <div class="hero-ball"></div>
      <h1>Draw the way. The bot figures out the rest.</h1>
      <form id="hero-form" autocomplete="off">
        <input id="hero-code" placeholder="Map code, e.g. 88528" spellcheck="false" autofocus>
        <button type="submit">Load map</button>
      </form>
      <p class="sub">A Fortunate Maps id, or a practice map: <a href="#" data-map="steps">steps</a> · <a href="#" data-map="tower">tower</a> · <a href="#" data-map="spikes">spikes</a> · <a href="#" data-map="slopes">slopes</a></p>
    </div>

    <div class="tools" id="tools" hidden>
      <button id="pen" class="on" title="Draw a rough path (drag on the map)">✎</button>
      <button id="undo" title="Undo the last line (Ctrl+Z)">↶</button>
      <button id="clear" title="Clear the path">✕</button>
    </div>
    <div class="hint" id="hint" hidden>Drag from your spawn toward the flag and back to draw a rough path. No path is fine too.</div>

    <div class="status" id="status" hidden>
      <div class="meter"><i id="meter"></i></div>
      <div class="line"><strong id="headline">Starting…</strong><span id="detail"></span></div>
      <div class="actions">
        <button id="watch" title="Watch the best run so far in the real TagPro client">▶ Watch in TagPro</button>
        <a href="/dashboard" target="_blank" title="Charts, every generation, the network">Details</a>
        <button id="stop" class="stop">Stop</button>
      </div>
    </div>
  </main>

  <dialog id="tagpro">
    <div class="dhead"><strong id="tagpro-title">TagPro</strong><span>best run in red, the rest in blue</span><button id="tagpro-close">Close</button></div>
    <iframe id="tagpro-frame" title="TagPro replay"></iframe>
  </dialog>

  <script src="/ui/sprites.js"></script>
  <script src="/ui/map.js"></script>
  <script src="/ui/play.js"></script>
</body>
</html>
